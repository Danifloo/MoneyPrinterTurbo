name: Recuperar audio ElevenLabs GoNews
on:
  pull_request:
    paths:
      - .github/workflows/elevenlabs-artemis-temp.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Install FFmpeg for validation
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Retrieve generated MP3
        run: |
          curl --fail --location --retry 2 --max-time 80 'https://storage.googleapis.com/xi-backend/database/workspace/57e1bd34f7cf40a99803bc62ed30b2c7/content_generation/aKcHniwhkZGqcsYJkLAD/3XazXdAYXADHBg4b1hQv/content.mp3?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=xi-backend-prod%40xi-labs.iam.gserviceaccount.com%2F20261023%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20261023T195659Z&X-Goog-Expires=7200&X-Goog-SignedHeaders=host&X-Goog-' -o elevenlabs_voice.mp3
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 elevenlabs_voice.mp3
          test $(stat -c%s elevenlabs_voice.mp3) -gt 20000
      - name: Upload voice file
        uses: actions/upload-artifact@v4
        with:
          name: ElevenLabs-Artemis-II-voz
          path: elevenlabs_voice.mp3
          retention-days: 1
